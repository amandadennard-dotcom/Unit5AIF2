<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading an Event Handler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: 'Geist', system-ui, sans-serif;
  background-color: #FFFFFF;
  color: #222222;
}

h1 {
  font-size: 20px;
  color: #1F1976;
  margin: 0 0 8px 0;
}

p.directions {
  font-size: 16px;
  line-height: 1.5;
  margin: 0 0 20px 0;
  background-color: #D5EFFF;
  color: #06338D;
  border-radius: 10px;
  padding: 12px 16px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

.legend-row {
  display: flex;
  gap: 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.legend-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  color: #555555;
}
.legend-chip .swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
}

.code-block {
  background-color: #2B2745;
  border-radius: 10px;
  padding: 20px 22px;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  color: #E4E2F8;
  margin-bottom: 18px;
  line-height: 1.9;
}

.token {
  background: none;
  border: none;
  font-family: 'Courier New', monospace;
  font-size: 16px;
  color: #FFFFFF;
  cursor: pointer;
  padding: 2px 3px;
  border-bottom: 3px solid transparent;
}
.token:hover, .token:focus-visible {
  outline: none;
  background-color: rgba(255,255,255,0.08);
}
.token.interact { border-bottom-color: #34BD43; }
.token.listen { border-bottom-color: #E11970; }
.token.respond { border-bottom-color: #0099F3; }
.token.active.interact { background-color: #34BD43; color: #FFFFFF; }
.token.active.listen { background-color: #E11970; color: #FFFFFF; }
.token.active.respond { background-color: #0099F3; color: #FFFFFF; }

.explanation {
  background-color: #E4E2F8;
  color: #1F1976;
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 18px;
  display: none;
}
.explanation .exp-title {
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
}

.progress-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.progress-chip {
  font-size: 14px;
  font-weight: 500;
  background-color: #F7F7FB;
  border: 1.5px solid #E4E2F8;
  border-radius: 6px;
  padding: 5px 12px;
  color: #4C42CF;
  display: flex;
  align-items: center;
  gap: 5px;
}
.progress-chip.explored {
  background-color: #CCF1D0;
  border-color: #7CDB87;
  color: #003F25;
}
.progress-chip .check { display: none; font-weight: 700; }
.progress-chip.explored .check { display: inline; }

.reveal-btn {
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 500;
  background-color: #4C42CF;
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  margin-bottom: 18px;
  display: none;
}
.reveal-btn:hover { background-color: #1F1976; }

.demo-frame {
  border: 1px solid #E4E2F8;
  border-radius: 10px;
  overflow: hidden;
  display: none;
}
.demo-browser-bar {
  background-color: #F7F7FB;
  padding: 8px 12px;
  border-bottom: 1px solid #E4E2F8;
  display: flex;
  gap: 6px;
}
.demo-browser-bar span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background-color: #E4E2F8;
  display: inline-block;
}
.demo-page {
  padding: 24px;
  text-align: center;
}
.demo-btn {
  background-color: #4C42CF;
  color: #FFFFFF;
  border: none;
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 500;
  padding: 10px 22px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 14px;
}
.demo-btn:hover { background-color: #1F1976; }
.demo-textarea {
  border: 1px solid #E4E2F8;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  color: #555555;
  min-height: 20px;
}
</style>
</head>
<body>

<h1>Reading an Event Handler in Code</h1>
<p class="directions">Click each highlighted part of the code to find out which job it's doing: interact, listen, or respond.</p>

<div class="sr-only" aria-live="polite" aria-atomic="true" id="liveRegion"></div>

<div class="legend-row">
  <div class="legend-chip"><span class="swatch" style="background-color:#34BD43;"></span>Interact</div>
  <div class="legend-chip"><span class="swatch" style="background-color:#E11970;"></span>Listen</div>
  <div class="legend-chip"><span class="swatch" style="background-color:#0099F3;"></span>Respond</div>
</div>

<div class="code-block">const btn = document.getElementById(<button type="button" class="token interact" id="tok-interact">"buttonID"</button>);

btn.<button type="button" class="token listen" id="tok-listen">addEventListener("click", () =&gt; {</button>
  <button type="button" class="token respond" id="tok-respond">textArea.textContent = "Button clicked";</button>
});</div>

<div class="progress-row" id="progressRow" aria-hidden="true"></div>

<div class="explanation" id="explanation">
  <span class="exp-title" id="expTitle"></span>
  <span id="expText"></span>
</div>

<button type="button" class="reveal-btn" id="revealBtn">See It In Action</button>

<div class="demo-frame" id="demoFrame">
  <div class="demo-browser-bar"><span></span><span></span><span></span></div>
  <div class="demo-page">
    <button type="button" class="demo-btn" id="demoBtn">Click Me</button>
    <div class="demo-textarea" id="demoTextarea"></div>
  </div>
</div>

<script>
const liveRegion = document.getElementById('liveRegion');
function announce(msg) { liveRegion.textContent = msg; }

const explanations = {
  interact: {
    title: '"buttonID" — Interact',
    text: 'This finds the specific element on the page, the button, that a user will interact with. Everything after this line is about watching and responding to that one element.'
  },
  listen: {
    title: 'addEventListener("click", ...) — Listen',
    text: 'This attaches a listener to the button that waits for a click. Nothing happens yet, it\'s just watching.'
  },
  respond: {
    title: 'textArea.textContent = "Button clicked"; — Respond',
    text: 'This is the handler, the code that actually runs once the listener detects a click. It updates the text on the page.'
  }
};

const explored = { interact: false, listen: false, respond: false };

function renderProgress() {
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  Object.keys(explored).forEach(part => {
    const chip = document.createElement('div');
    chip.className = 'progress-chip' + (explored[part] ? ' explored' : '');
    chip.innerHTML = '<span class="check">&#10003;</span>' + part.charAt(0).toUpperCase() + part.slice(1);
    row.appendChild(chip);
  });
}

function selectToken(part) {
  document.querySelectorAll('.token').forEach(t => t.classList.remove('active'));
  document.getElementById('tok-' + part).classList.add('active');

  const exp = document.getElementById('explanation');
  exp.style.display = 'block';
  document.getElementById('expTitle').textContent = explanations[part].title;
  document.getElementById('expText').textContent = explanations[part].text;
  announce(explanations[part].title + ': ' + explanations[part].text);

  explored[part] = true;
  renderProgress();

  if (explored.interact && explored.listen && explored.respond) {
    document.getElementById('revealBtn').style.display = 'inline-block';
  }
}

document.getElementById('tok-interact').addEventListener('click', () => selectToken('interact'));
document.getElementById('tok-listen').addEventListener('click', () => selectToken('listen'));
document.getElementById('tok-respond').addEventListener('click', () => selectToken('respond'));

document.getElementById('revealBtn').addEventListener('click', () => {
  document.getElementById('demoFrame').style.display = 'block';
  announce('Live demo revealed. Click the button below to see the handler run for real.');
});

document.getElementById('demoBtn').addEventListener('click', () => {
  document.getElementById('demoTextarea').textContent = 'Button clicked';
  announce('Button clicked. The handler ran and updated the text.');
});

renderProgress();
</script>

</body>
</html>
