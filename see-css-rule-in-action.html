<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>See a CSS Rule in Action</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: 'Geist', system-ui, sans-serif;
  background-color: #FFFFFF;
  color: #222222;
}

h1 {
  font-size: 20px;
  color: #1F1976;
  margin: 0 0 8px 0;
}

p.directions {
  font-size: 16px;
  line-height: 1.5;
  margin: 0 0 20px 0;
  background-color: #D5EFFF;
  color: #06338D;
  border-radius: 10px;
  padding: 12px 16px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

.legend-row {
  display: flex;
  gap: 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.legend-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  color: #555555;
}
.legend-chip .swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
}

.code-block {
  background-color: #2B2745;
  border-radius: 10px;
  padding: 22px 24px;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  color: #E4E2F8;
  margin-bottom: 18px;
}

.token {
  background: none;
  border: none;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  color: #FFFFFF;
  cursor: pointer;
  padding: 2px 3px;
  border-bottom: 3px solid transparent;
}
.token:hover, .token:focus-visible {
  outline: none;
  background-color: rgba(255,255,255,0.08);
}
.token.selector { border-bottom-color: #34BD43; }
.token.property { border-bottom-color: #E11970; }
.token.value { border-bottom-color: #0099F3; }
.token.active.selector { background-color: #34BD43; color: #FFFFFF; }
.token.active.property { background-color: #E11970; color: #FFFFFF; }
.token.active.value { background-color: #0099F3; color: #FFFFFF; }

.explanation {
  background-color: #E4E2F8;
  color: #1F1976;
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 18px;
  display: none;
}
.explanation .exp-title {
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
}
.explanation-placeholder {
  font-size: 16px;
  color: #888888;
  font-style: italic;
  margin-bottom: 18px;
}

.reveal-btn {
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 16px;
  font-weight: 500;
  background-color: #4C42CF;
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  margin-bottom: 18px;
}
.reveal-btn:hover { background-color: #1F1976; }
.reveal-btn:disabled { background-color: #ACA8EA; cursor: not-allowed; }
.reveal-btn:focus-visible { outline: 3px solid #ACA8EA; outline-offset: 2px; }

.result-frame {
  border: 1px solid #E4E2F8;
  border-radius: 10px;
  overflow: hidden;
  display: none;
}
.result-browser-bar {
  background-color: #F7F7FB;
  padding: 8px 12px;
  border-bottom: 1px solid #E4E2F8;
  display: flex;
  gap: 6px;
}
.result-browser-bar span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background-color: #E4E2F8;
  display: inline-block;
}
.result-page {
  padding: 30px;
  text-align: left;
}
.result-page h2 {
  font-size: 22px;
  margin: 0;
  display: inline-block;
  color: blue;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<h1>See a CSS Rule in Action</h1>
<p class="directions">Click each highlighted part of the rule below to find out what it does. Then reveal the result.</p>

<div class="sr-only" aria-live="polite" aria-atomic="true" id="liveRegion"></div>

<div class="legend-row">
  <div class="legend-chip"><span class="swatch" style="background-color:#34BD43;"></span>Selector</div>
  <div class="legend-chip"><span class="swatch" style="background-color:#E11970;"></span>Property</div>
  <div class="legend-chip"><span class="swatch" style="background-color:#0099F3;"></span>Value</div>
</div>

<div class="code-block">
  <button type="button" class="token selector" id="tok-selector">h1</button> {
  <br>&nbsp;&nbsp;<button type="button" class="token property" id="tok-property">color</button>:
  <button type="button" class="token value" id="tok-value">blue</button>;
  <br>}
</div>

<p class="explanation-placeholder" id="explanationPlaceholder">Click a highlighted word above to learn what it does.</p>
<div class="explanation" id="explanation">
  <span class="exp-title" id="expTitle"></span>
  <span id="expText"></span>
</div>

<button type="button" class="reveal-btn" id="revealBtn" disabled>Show the result</button>

<div class="result-frame" id="resultFrame">
  <div class="result-browser-bar"><span></span><span></span><span></span></div>
  <div class="result-page">
    <h2>Welcome to My Website</h2>
  </div>
</div>

<script>
const liveRegion = document.getElementById('liveRegion');
function announce(msg) { liveRegion.textContent = msg; }

const explanations = {
  selector: {
    title: "h1 — Selector",
    text: "This tells the browser which element to style. Every heading tagged h1 on the page will follow this rule."
  },
  property: {
    title: "color — Property",
    text: "This names what's being changed. Here, it's the text color."
  },
  value: {
    title: "blue — Value",
    text: "This sets the specific setting for that property. The text will render in blue."
  }
};

const explored = { selector: false, property: false, value: false };

function selectToken(part) {
  document.querySelectorAll('.token').forEach(t => t.classList.remove('active'));
  document.getElementById('tok-' + part).classList.add('active');

  document.getElementById('explanationPlaceholder').style.display = 'none';
  const exp = document.getElementById('explanation');
  exp.style.display = 'block';
  document.getElementById('expTitle').textContent = explanations[part].title;
  document.getElementById('expText').textContent = explanations[part].text;
  announce(explanations[part].title + ': ' + explanations[part].text);

  explored[part] = true;

  if (explored.selector && explored.property && explored.value) {
    document.getElementById('revealBtn').disabled = false;
  }
}

document.getElementById('tok-selector').addEventListener('click', () => selectToken('selector'));
document.getElementById('tok-property').addEventListener('click', () => selectToken('property'));
document.getElementById('tok-value').addEventListener('click', () => selectToken('value'));

document.getElementById('revealBtn').addEventListener('click', () => {
  document.getElementById('resultFrame').style.display = 'block';
  announce('Result revealed. The heading now renders in blue, exactly as the rule set it to.');
});
</script>

</body>
</html>
