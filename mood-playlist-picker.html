<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mood Playlist Picker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: 'Geist', system-ui, sans-serif;
  background-color: #FFFFFF;
  color: #222222;
}

.app-frame {
  border: 1px solid #E4E2F8;
  border-radius: 10px;
  overflow: hidden;
}
.app-browser-bar {
  background-color: #F7F7FB;
  padding: 8px 12px;
  border-bottom: 1px solid #E4E2F8;
  display: flex;
  gap: 6px;
}
.app-browser-bar span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background-color: #E4E2F8;
  display: inline-block;
}

.app-page {
  padding: 30px 24px;
  text-align: center;
  transition: background-color 0.3s ease;
}
@media (prefers-reduced-motion: reduce) {
  .app-page { transition: none; }
}

.app-page h2 {
  font-size: 18px;
  color: #222222;
  margin: 0 0 16px 0;
}

.mood-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

.mood-btn {
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 500;
  background-color: #FFFFFF;
  color: #222222;
  border: 1.5px solid #CCCCCC;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
}
.mood-btn:hover { background-color: #F0F0F0; }

.playlist-display {
  font-size: 20px;
  font-weight: 700;
  color: #222222;
  min-height: 30px;
}
</style>
</head>
<body>

<div class="app-frame">
  <div class="app-browser-bar"><span></span><span></span><span></span></div>
  <div class="app-page" id="appPage">
    <h2>Mood Playlist Picker</h2>
    <div class="mood-buttons">
      <button type="button" class="mood-btn" id="happyButton">Happy</button>
      <button type="button" class="mood-btn" id="chillButton">Chill</button>
      <button type="button" class="mood-btn" id="sadButton">Sad</button>
    </div>
    <div class="playlist-display" id="playlistText">Pick a mood to see your playlist</div>
  </div>
</div>

<script>
let mood = "";

function showPlaylist() {
  const playlistText = document.getElementById('playlistText');
  const appPage = document.getElementById('appPage');

  if (mood === "happy") {
    playlistText.textContent = "Upbeat Anthems";
    appPage.style.backgroundColor = "#FFE3CE";
  } else if (mood === "chill") {
    playlistText.textContent = "Lo-Fi Focus";
    appPage.style.backgroundColor = "#D5EFFF";
  } else {
    playlistText.textContent = "Rainy Day Ballads";
    appPage.style.backgroundColor = "#CBD6E3";
  }
}

document.getElementById('happyButton').addEventListener('click', () => { mood = "happy"; showPlaylist(); });
document.getElementById('chillButton').addEventListener('click', () => { mood = "chill"; showPlaylist(); });
document.getElementById('sadButton').addEventListener('click', () => { mood = "sad"; showPlaylist(); });
</script>

</body>
</html>
